modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="MrCrayfish, Ribs"
description="${mod_description}"
enumExtensions="META-INF/enumextensions.json"

# Mixins (gun rendering and a few client hooks)
[[mixins]]
    config="scguns.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    mandatory=true
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[9.5.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.9.3,5)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0.0,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="create_ironworks"
    type="optional"
    versionRange="[4.0.3,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="createaddition"
    type="optional"
    versionRange="[1.7.2,)"
    ordering="NONE"
    side="BOTH"
